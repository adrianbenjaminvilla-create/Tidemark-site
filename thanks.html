<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank you — Tidemark Power Washing</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#101820;
    --concrete:#ece8df;
    --spray:#2e9fd6;
    --white:#faf9f5;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--ink);
    color:var(--white);
    font-family:'Inter',sans-serif;
    text-align:center;
    padding:2rem;
  }
  .card{
    max-width:480px;
  }
  h1{
    font-family:'Oswald',sans-serif;
    font-weight:700;
    font-size:2rem;
    margin:0 0 1rem;
    color:var(--spray);
  }
  p{
    font-size:1.1rem;
    line-height:1.6;
    color:var(--concrete);
    margin:0 0 1.5rem;
  }
  a.button{
    display:inline-block;
    background:var(--spray);
    color:var(--ink);
    font-weight:600;
    text-decoration:none;
    padding:0.9rem 1.8rem;
    border-radius:6px;
  }
  a.phone{
    display:block;
    margin-top:1.5rem;
    color:var(--concrete);
    text-decoration:none;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Got it — thanks!</h1>
    <p>We'll get back to you within a day, usually sooner. If it's urgent, call or text us directly.</p>
    <a class="button" href="./">Back to site</a>
    <a class="phone" href="tel:17149137571">(714) 913-7571</a>
  </div>
</body>
</html>
